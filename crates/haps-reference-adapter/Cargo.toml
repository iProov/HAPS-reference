[package]
name = "haps-reference-adapter"
description = "Experimental NDJSON adapter for the partial HAPS canonicalizer; not production-ready"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
haps-canon = { path = "../haps-canon" }
haps-hash = { path = "../haps-hash" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
