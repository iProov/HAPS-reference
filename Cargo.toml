[workspace]
resolver = "2"
members = [
    "crates/haps-canon",
    "crates/haps-hash",
    "crates/haps-reference-adapter",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/iProov/HAPS-reference"
# These crates are an experimental partial reference implementation and are not
# intended for crates.io. Publishing would squat names the project may want for
# something it can actually stand behind.
publish = false
